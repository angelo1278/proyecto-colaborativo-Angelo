<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anllelo</title>
  <style>
    /* Tipografía importada de Google Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Open+Sans&display=swap');

    body {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      background-color: #f4f4f7;
      color: #333;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100vh;
      background: linear-gradient(120deg, #2c3e50, #34495e);
      color: #ffffff;
      flex-direction: column;
      padding: 0 20px;
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .hero p {
      font-size: 1.2rem;
      max-width: 600px;
      line-height: 1.6;
    }

    .hero .btn {
      margin-top: 30px;
      padding: 12px 30px;
      font-size: 1rem;
      background-color: #ffffff;
      color: #2c3e50;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      text-transform: uppercase;
    }

    .hero .btn:hover {
      background-color: #ecf0f1;
    }
  </style>
</head>
<body>

  <section class="hero">
    <h1>Anllelo</h1>
    <p>Descubre la elegancia en cada detalle. Bienvenido a una experiencia donde el estilo y la sofisticación se encuentran.</p>
    <form action="web1.html"><button class="btn">Descubrir más</button></form>
  </section>

</body>
</html>
